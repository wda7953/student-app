<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>總覽</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#7A5C3E">
</head>
<body class="has-tabbar">
  <div class="ov-header">
    <div>
      <div class="oh-title">總覽</div>
      <div class="oh-date" id="oh-date"></div>
    </div>
    <button class="ov-refresh" id="oh-refresh" onclick="refreshDashboard()">刷新</button>
  </div>

  <div class="dash">
    <!-- 三格 KPI -->
    <div class="kpi-grid">
      <div class="kpi">
        <div class="k-label">本週上課</div>
        <div class="k-num"><span id="kpi-week">–</span><small> 堂</small></div>
        <div class="k-sub" id="kpi-week-venue">–</div>
      </div>
      <div class="kpi">
        <div class="k-label">學生總數</div>
        <div class="k-num"><span id="kpi-students">–</span><small> 位</small></div>
        <div class="k-sub">在線學生</div>
      </div>
      <div class="kpi">
        <div class="k-label">待上堂數</div>
        <div class="k-num"><span id="kpi-remaining">–</span><small> 堂</small></div>
        <div class="k-sub muted">剩餘預收</div>
      </div>
    </div>

    <!-- 上課統計 -->
    <div class="dash-card">
      <div class="dc-title" style="margin-bottom:12px">上課統計</div>
      <div style="display:flex;gap:12px">
        <div style="flex-grow:1;background:#FAF7F2;border-radius:12px;padding:12px 14px">
          <div style="font-size:12px;color:#8e8e93">本週已上</div>
          <div style="font-size:22px;font-weight:700;margin-top:2px"><span id="stat-week">–</span> <span style="font-size:13px;color:#8e8e93">堂</span></div>
        </div>
        <div style="flex-grow:1;background:#FAF7F2;border-radius:12px;padding:12px 14px">
          <div style="font-size:12px;color:#8e8e93">本月已上</div>
          <div style="font-size:22px;font-weight:700;margin-top:2px"><span id="stat-month">–</span> <span style="font-size:13px;color:#8e8e93">堂</span></div>
        </div>
      </div>
    </div>

    <!-- 本週上課記錄 -->
    <div class="dash-card">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div class="dc-title">本週上課</div>
        <div id="week-range" style="font-size:13px;color:#1c1c1e;font-weight:600">–</div>
      </div>
      <div class="week-strip" id="week-strip"></div>
      <div id="day-title" style="font-size:13px;color:#8e8e93;font-weight:600;margin:14px 0 4px"></div>
      <div id="day-list"></div>
    </div>

    <!-- 收費入口卡 -->
    <div class="pay-card" style="cursor:pointer" onclick="location.href='charging.html?v=33'">
      <div style="width:40px;height:40px;border-radius:12px;background:#F2EBE0;display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7A5C3E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
      </div>
      <div style="flex-grow:1">
        <div style="font-size:16px;font-weight:700">收費</div>
        <div style="font-size:12px;color:#8e8e93;margin-top:2px">看收費紀錄與預收明細</div>
      </div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c7c7cc" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </div>
  </div>

  <nav class="tabbar">
    <a href="overview.html?v=33" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
      <span>總覽</span>
    </a>
    <a href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/></svg>
      <span>學生</span>
    </a>
    <a href="charging.html?v=33">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
      <span>收費</span>
    </a>
  </nav>

  <script src="js/api.js"></script>
  <script src="js/overview.js?v=33"></script>
</body>
</html>
