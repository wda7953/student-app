<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>收費</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#7A5C3E">
</head>
<body class="has-tabbar">
  <div class="ov-header">
    <div style="display:flex;align-items:center;gap:12px">
      <svg onclick="location.href='overview.html?v=33'" style="cursor:pointer" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      <div class="oh-title">收費</div>
      <span class="oh-date" id="ch-count"></span>
    </div>
  </div>

  <div class="dash">
    <!-- 三格 KPI -->
    <div class="kpi-grid">
      <div class="kpi">
        <div class="k-label">本月收到</div>
        <div class="k-num" style="font-size:19px;margin-top:6px" id="kpi-month">–</div>
        <div class="k-sub" id="kpi-month-count">–</div>
      </div>
      <div class="kpi">
        <div class="k-label">累計收入</div>
        <div class="k-num" style="font-size:19px;margin-top:6px" id="kpi-total">–</div>
        <div class="k-sub" id="kpi-total-count">–</div>
      </div>
      <div class="kpi">
        <div class="k-label">未上課預收</div>
        <div class="k-num" style="font-size:19px;margin-top:6px" id="kpi-prepaid">–</div>
        <div class="k-sub muted">剩餘堂數×鐘點</div>
      </div>
    </div>

    <!-- 篩選 -->
    <div style="display:flex;gap:8px">
      <button class="filter-chip active" onclick="setRange('本月')">本月</button>
      <button class="filter-chip" onclick="setRange('上月')">上月</button>
      <button class="filter-chip" onclick="setRange('今年')">今年</button>
      <button class="filter-chip" onclick="setRange('全部')">全部</button>
    </div>

    <!-- 收費紀錄 -->
    <div id="pay-list" style="display:flex;flex-direction:column;gap:10px">
      <div style="color:#8e8e93;font-size:14px;padding:8px 2px">載入中…</div>
    </div>
  </div>

  <nav class="tabbar">
    <a href="overview.html?v=33">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
      <span>總覽</span>
    </a>
    <a href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/></svg>
      <span>學生</span>
    </a>
    <a href="charging.html?v=33" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
      <span>收費</span>
    </a>
  </nav>

  <script src="js/api.js"></script>
  <script src="js/charging.js?v=33"></script>
</body>
</html>
